name: Build and Deploy to ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nginx-ecs-app
  ECS_CLUSTER: nginx-cluster
  ECS_SERVICE: nginx-service
  ECS_TASK_DEFINITION: nginx-app
  CONTAINER_NAME: nginx

jobs:

  build-and-deploy:

    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # =====================================================
      # CHECKOUT CODE
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # CONFIGURE AWS
      # =====================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # =====================================================
      # LOGIN TO AMAZON ECR
      # =====================================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # =====================================================
      # BUILD DOCKER IMAGE
      # =====================================================

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

      # =====================================================
      # PUSH IMAGE TO ECR
      # =====================================================

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # =====================================================
      # DOWNLOAD CURRENT ECS TASK DEFINITION
      # =====================================================

      - name: Download ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_DEFINITION \
            --query taskDefinition \
            > task-definition.json

      # =====================================================
      # UPDATE TASK DEFINITION WITH NEW IMAGE
      # =====================================================

      - name: Update ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # =====================================================
      # DEPLOY TO ECS
      # =====================================================

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # =====================================================
      # DEPLOYMENT COMPLETE
      # =====================================================

      - name: Deployment complete
        run: |
          echo "Deployment successful!"
          echo "Image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "ECS Cluster: $ECS_CLUSTER"
          echo "ECS Service: $ECS_SERVICE"